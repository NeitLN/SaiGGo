name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Cài đúng phiên bản đã khóa để mọi máy và CI chạy cùng thư viện.
      - run: pip install -e ".[dev]" -c requirements-lock.txt
      # Test không tải dữ liệu OSM qua mạng.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Kiểm lỗ hổng đã biết của thư viện. Không nằm trong danh sách check bắt buộc của branch `main`,
  # để một lỗ hổng mới của bên thứ ba không chặn PR của cả nhóm; job đỏ thì người tích hợp xử lý.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install pip-audit
      - name: pip-audit (requirements-lock.txt)
        run: pip-audit -r requirements-lock.txt
      - name: npm audit (mức high trở lên)
        working-directory: frontend
        run: npm audit --audit-level=high
